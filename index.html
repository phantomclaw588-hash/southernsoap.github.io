<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pretty Clean Soap</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <div class="logo">Pretty Clean Soap</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="hero-scroll" id="heroScroll">
    <div class="hero-sticky">
        <div class="hero-content">
            <h1 class="hero-title">Obsidian Soap</h1>

            <div class="hero-art">
                <div class="side-images left">
                    <img src="images/christiancmccorbeti-skincare-6664582_1920.jpg" alt="Handmade soap">
                    <img src="images/lavkachudes-honey-7330657_1920.jpg" alt="Honey soap">
                </div>

                <div class="center-image">
                    <img src="images/download.jpg" alt="Obsidian soap">
                    <a href="shop.html" class="shop-button">Shop Now</a>
                </div>

                <div class="side-images right">
                    <img src="images/download (1).jpg" alt="Handmade soap">
                    <img src="images/phuonghoangthuy-handmade-soap-4926844_1920.jpg" alt="Handmade soap">
                </div>
            </div>
        </div>
    </div>
</section>

<section class="about">
    <h2>Why Pretty Clean?</h2>
    <p>
        Every bar is handcrafted in small batches using skin-loving oils and carefully selected ingredients.
        No mass production. Just beautiful soap.
    </p>
</section>

<footer>
    <p>© 2026 Pretty Clean Soap</p>
</footer>

<script>
    const heroScroll = document.getElementById('heroScroll');
    const title = document.querySelector('.hero-title');
    const sideImages = document.querySelectorAll('.side-images');

    function updateHero() {
        const rect = heroScroll.getBoundingClientRect();
        const progress = Math.min(Math.max(-rect.top / window.innerHeight, 0), 1);

        title.style.opacity = 1 - progress * 1.4;
        title.style.transform = `translateY(${progress * -30}px)`;

        sideImages.forEach(el => {
            const baseOffset = el.classList.contains('left') ? -40 : 40;
            const fadeStart = 0.18;
            const fadeProgress = Math.min(Math.max((progress - fadeStart) / 0.55, 0), 1);

            el.style.opacity = fadeProgress;
            el.style.transform = `translateX(${baseOffset * (1 - fadeProgress)}px)`;
        });
    }

    window.addEventListener('scroll', updateHero);
    window.addEventListener('load', updateHero);
</script>

</body>

<!DOCTYPE html>
<html>
<head>
    <title>Obsidian Soap Co. | Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
</nav>


<header class="shop-header">
    <h1>Obsidian Soap Co.</h1>
    <p>Handcrafted soaps inspired by nature, tradition, and simplicity.</p>
</header>


<section class="products">

    <div class="product-card">

        <img src="https://pixabay.com/images/download/x-2055680_1920.jpg" 
        alt="Handmade soap and natural ingredients">


        <div class="product-info">

            <h2>Support Obsidian Soap Co.</h2>

            <p>
                Help support our small-batch soap company. 
                Your donation helps us create handcrafted soaps 
                using quality oils, natural ingredients, and traditional methods.
            </p>


            <div class="price">
                Donate
            </div>


            <!-- Square Payment Button -->
            <div style="
              overflow: auto;
              display: flex;
              flex-direction: column;
              justify-content: flex-end;
              align-items: center;
              width: 259px;
              background: #FFFFFF;
              border: 1px solid rgba(0, 0, 0, 0.1);
              border-radius: 10px;
              font-family: Helvetica, Arial, sans-serif;
              margin:auto;
              ">

              <div style="padding:20px;">

                <a target="_blank" 
                href="https://square.link/u/G4hGdfsR?src=embed"
                style="
                display:inline-block;
                font-size:18px;
                line-height:48px;
                height:48px;
                color:white;
                min-width:212px;
                background-color:#111;
                text-align:center;
                text-decoration:none;
                border-radius:6px;
                ">
                Donate Now
                </a>

              </div>

            </div>


        </div>

    </div>

</section>
